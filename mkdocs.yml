site_name: Cosmic Death Fungus
site_url: https://cosmicdeathfungus.github.io
site_description: The NAC Protocol — Community Documentation for Addressing Systemic Fungal Infection
site_author: Peribsen & MacLir | cosmicdeathfungus community
repo_url: https://github.com/cosmicdeathfungus/cosmicdeathfungus.github.io
repo_name: cosmicdeathfungus
edit_uri: edit/main/docs/

theme:
  name: material
  # No palette toggle: the colour scheme follows the visitor's operating-system
  # / browser preference automatically.
  #
  # The leading `(prefers-color-scheme)` entry is what makes this *stay*
  # automatic. Material stores the resolved palette in localStorage and, on
  # every later visit, trusts that stored index instead of re-evaluating the
  # media queries — so a light/dark pair alone freezes a visitor into whichever
  # scheme they happened to arrive with. This "automatic" entry is the one case
  # Material re-resolves against `matchMedia` on each load, from the two
  # entries below it.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
  font:
    text: Source Serif 4
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # Renders `:material-flask:` / `:octicons-arrow-right-24:` shorthand as inline
  # SVG icons. Without this, Material's icon syntax leaks through as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Makes bare URLs clickable, so a pasted source link is never dead text.
  - pymdownx.magiclink:
      repo_url_shorthand: false
      social_url_shorthand: false
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

